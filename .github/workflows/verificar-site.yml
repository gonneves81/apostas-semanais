      - name: Verificar arquivos e conteudo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          html = Path("index.html").read_text(encoding="utf-8")
          assert '<script src="./boletins.js?v=5" defer></script>' in html
          assert '<script src="./qualidade.js?v=2" defer></script>' in html
          assert '<script src="./apostas-reais.js?v=1" defer></script>' in html
          assert '<link rel="stylesheet" href="./melhorias.css?v=1">' in html
          assert '<link rel="stylesheet" href="./boletins.css?v=3">' in html
          assert '<script src="./ultimos10.js?v=1" defer></script>' in html
          assert '<link rel="stylesheet" href="./ultimos10.css?v=1">' in html
          assert '<script src="./tabelas-ligas.js?v=3" defer></script>' in html
          assert '<link rel="stylesheet" href="./tabelas-ligas.css?v=3">' in html
          assert '<script src="./classificacoes.js?v=1" defer></script>' in html
          assert '<link rel="stylesheet" href="./classificacoes.css?v=1">' in html
          assert '<button class="nav-btn" data-go="tables">' in html
          assert 'id="view-tables"' in html and 'id="tlg-export"' in html
          history=json.loads(Path("dados/ultimos10-2026-10-19.json").read_text(encoding="utf-8"))
          assert len(history["byGame"])==139
          for g in json.loads(re.search(r'<script id="data-json" type="application/json">(.*?)</script>',html,re.S).group(1))["games"]:
              b=history["byGame"][str(g["id"])]
              for which in ("home","away"):
                  team=b[which]
                  assert team["available"]==len(team["results"])<=10
                  assert all(row["date"]<b["date"] for row in team["results"])
                  assert team["stats"]["gf"]==sum(row["gf"] for row in team["results"])
                  assert team["stats"]["ga"]==sum(row["ga"] for row in team["results"])
          assert 'id="rank-list"' in html and 'id="view-games"' in html
          data = json.loads(re.search(r'<script id="data-json" type="application/json">(.*?)</script>',html,re.S).group(1))
          assert len(data["games"]) > 10 and len(data["leagues"]) == 12
          st=json.loads(Path("dados/classificacoes-2026-10-22.json").read_text(encoding="utf-8"))
          assert len(st["leagues"]) == 12
          for code, league in st["leagues"].items():
              teams=league["standings"]
              assert len(teams)==league["teams"]
              assert len(teams)>=12
              assert sum(row["p"] for row in teams)==2*league["fixturesUsed"], code
              for row in teams:
                  assert row["pts"]==3*row["w"]+row["d"], code
                  assert row["p"]==row["w"]+row["d"]+row["l"], code
                  assert row["gf"]>=0 and row["ga"]>=0
                  assert row["gd"]==row["gf"]-row["ga"]
                  assert len(row["recent"])<=7
                  assert all(x["date"]<st["cutoffExclusive"] and x["result"] in ("V","E","D") for x in row["recent"])
          for game in data["games"]:
              league=st["leagues"][game["league"]]
              bykey={row["key"] for row in league["standings"]}
              aliases=league["fixtureAliases"]
              for name in (game["home"],game["away"]):
                  normalized=''.join(c for c in __import__('unicodedata').normalize('NFKD', name).lower() if c.isalnum() and ord(c)<128)
                  assert aliases.get(name,normalized) in bykey,(game["league"],name)
          print("Classificacoes: 12 competicoes, pontos, GM/GS e ultimos 7: OK")
          print("Estrutura e dados: OK")
          PY
