name: Verificar Apostas Semanais — Modelo de Golos
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "boletins.js"
      - "golos.js"
      - "golos.css"
      - "dados/modelo-golos-2026-10-19.json"
      - ".github/workflows/verificar-site.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe dos scripts
        run: |
          node --check golos.js
          node --check boletins.js
          node --check qualidade.js
          node --check apostas-reais.js
          node --check ultimos10.js
          node --check tabelas-ligas.js
          node --check classificacoes.js
      - name: Testar coerência do modelo de golos
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          data=json.loads(re.search(r'<script id="data-json" type="application/json">(.*?)</script>',html,re.S).group(1))
          model=json.loads(Path("dados/modelo-golos-2026-10-19.json").read_text(encoding="utf-8"))
          assert len(data['games'])==len(model['games'])==139
          assert model['coverage']['calculated']==122
          assert model['coverage']['insufficient']==17
          assert sorted(model['model']['markets'])==['AND','BTTS','O25']
          assert 'id="view-golos"' in html and 'golos.js?v=1' in html
          assert 'boletins.js?v=6' in html
          for g in data['games']:
              row=model['games'][str(g['id'])]
              assert row['id']==g['id'] and row['home']==g['home'] and row['away']==g['away']
              assert row['date'] >= data['start']
              for side in ('home','away'):
                  assert all(x['date']<row['date'] for x in row['latest'][side])
                  assert len(row['latest'][side])<=7
              p=row.get('prob')
              if p:
                  assert set(p)=={'BTTS','O25','AND'}
                  assert all(0 < v < 1 for v in p.values())
                  assert p['AND']<=p['BTTS'] and p['AND']<=p['O25']
              else:
                  assert row['status']=='insuficiente'
          print('OK: 139 jogos, 122 estimativas, 17 amostras insuficientes e tres mercados')
          PY
      - name: Validar painel e boletins em Chromium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          content=Path('index.html').read_text(encoding='utf-8')
          verify=r'''<script>
          document.addEventListener('DOMContentLoaded',()=>{
            setTimeout(()=>{
              try{
                const app=document.querySelector('#view-golos');
                if(!app||app.hidden)throw Error('Painel de golos nao abriu como inicio');
                const cards=Array.from(document.querySelectorAll('#gm-games .gm-card'));
                if(cards.length!==139)throw Error('Quantidade de jogos errada: '+cards.length);
                if(cards.filter(x=>x.querySelectorAll('.gm-prob').length!==3).length)
                  throw Error('Encontrados mercados fora dos tres pretendidos');
                if(cards.filter(x=>x.querySelector('.gm-unavailable')).length!==17)
                  throw Error('Falta avisar os 17 encontros sem amostra');
                const sort=document.querySelector('[data-gm-head="AND"]');
                sort.click();
                if(!sort.classList.contains('active'))throw Error('Ordenacao de AM E +2,5 falhou');
                const model=window.ApostasGolosModel;
                if(!model||!model.games)throw Error('Modelo nao foi carregado');
                const available=cards.find(c=>c.querySelector('[data-add-slip="1"]'));
                if(!available)throw Error('Nao existem selecoes para boletim');
                const b=available.querySelector('[data-add-slip="1"]'),id=b.dataset.game;
                if(b.dataset.market!=='AND')throw Error('Mercado do boletim nao acompanha a selecao');
                b.click();
                const saved=JSON.parse(localStorage.getItem('apostas_semanal_slips_2026-10-19_2026-10-25')||'{}');
                if(!saved['1']?.items.some(x=>String(x.id)===id && x.market==='AND'))
                  throw Error('Aposta foi guardada com mercado errado');
                const select=document.querySelector('#gm-lg');
                select.value='PT';select.dispatchEvent(new Event('change',{bubbles:true}));
                if(document.querySelectorAll('#gm-games .gm-card').length!==9)
                  throw Error('Filtro da Liga Portugal falhou');
                const min=document.querySelector('#gm-min');
                min.value='80';min.dispatchEvent(new Event('change',{bubbles:true}));
                const modelCards=Array.from(document.querySelectorAll('#gm-games .gm-card'));
                if(modelCards.some(c=>{let id=c.dataset.gmId;let p=model.games[id]?.prob?.AND;return p!==undefined&&p<.8}))
                   throw Error('Filtro minimo nao respeitado');
                document.body.dataset.golosSmoke='PASS';
              }catch(e){document.body.dataset.golosSmoke='FAIL: '+e.message}
            },2000);
          });
          </script>'''
          Path('.golos-test.html').write_text(content.replace('</body>',verify+'</body>'),encoding='utf-8')
          PY
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --allow-file-access-from-files --disable-dev-shm-usage --disable-gpu --virtual-time-budget=9000 --dump-dom "file://$PWD/.golos-test.html#golos" > /tmp/golos-dom.html 2>/tmp/golos-errors.txt
          python3 - <<'PY'
          import re
          from html import unescape
          from pathlib import Path
          html=Path('/tmp/golos-dom.html').read_text(encoding='utf-8')
          m=re.search(r'<body[^>]*data-golos-smoke="([^"]+)"',html)
          result=unescape(m.group(1)) if m else 'NOT_RUN'
          print('Resultado do teste:',result)
          assert result=='PASS',result
          PY
